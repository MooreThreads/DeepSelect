name: release-musa-auto

# Automated MUSA release: bump `deep_select/__version__.py` on main and push.
# The build runs on a self-hosted MUSA runner (the extension needs the MUSA
# toolchain; GitHub-hosted runners cannot build it), then this workflow:
#   1. builds the plain-version wheel for PyPI (no local version label),
#   2. runs the GPU smoke test + MUSA regression tests,
#   3. tags v<version> and creates a GitHub Release with the wheel,
#   4. dispatches `publish-pypi.yml`, which uploads via PyPI Trusted Publishing.
#
# Required repo setup:
#   - self-hosted runner with labels: self-hosted, linux, x64, musa, musa52
#     (see scripts/ci/musa/setup_github_runner.sh)
#   - GitHub environment `pypi` (already created)
#   - PyPI pending publisher for project deepselect-musa, workflow
#     publish-pypi.yml, environment pypi

on:
  push:
    branches: [main]
    paths:
      - deep_select/__version__.py
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and test only (no tag, release, or PyPI publish)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-musa-auto
  cancel-in-progress: false

env:
  MUSA_BUILD_IMAGE: sglang-ci-runner:musa52-py310-v2-stack
  PYPI_PACKAGE_NAME: deepselect-musa

jobs:
  build:
    name: build + GPU test (MUSA runner)
    if: github.repository == 'MooreThreads/DeepSelect'
    runs-on: [self-hosted, linux, x64, musa, musa52]
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      skip: ${{ steps.ver.outputs.skip }}
    steps:
      - name: Check out source (with submodules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Resolve version and idempotency guard
        id: ver
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: |
          set -euo pipefail
          VERSION=$(python3 -c "exec(open('deep_select/__version__.py').read()); print(__version__)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::deep_select/__version__.py must be a public PEP 440 version (X.Y.Z) for PyPI; got: $VERSION"
            exit 1
          fi
          SKIP=false
          if [[ "$DRY_RUN" != "true" ]] && git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q .; then
            SKIP=true
            echo "::notice::tag v$VERSION already exists; nothing to release (bump the version to release)"
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

      - name: Build wheel in MUSA build container
        if: steps.ver.outputs.skip != 'true'
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          SRC=$(mktemp -d)
          OUT=$(mktemp -d)
          trap 'rm -rf "$SRC" "$OUT"' EXIT
          cp -a "$PWD/." "$SRC/DeepSelect"
          docker run --rm --network host \
            -e DEEP_SELECT_VERSION="$VERSION" \
            -e DEEP_SELECT_PUBLIC_VERSION="$VERSION" \
            -e DEEP_SELECT_DIST_NAME="$PYPI_PACKAGE_NAME" \
            -v "$SRC/DeepSelect:/src/DeepSelect" \
            -v "$OUT:/out" \
            --entrypoint /bin/bash \
            "$MUSA_BUILD_IMAGE" \
            -lc "cd /src/DeepSelect && bash scripts/ci/musa/build_wheel.sh \
                  --src /src/DeepSelect --out /out --skip-src-setup"
          mkdir -p dist
          cp "$OUT"/deepselect_musa-*.whl dist/
          ls -l dist

      - name: GPU smoke + regression tests
        if: steps.ver.outputs.skip != 'true'
        run: |
          set -euo pipefail
          WHEEL=$(ls dist/deepselect_musa-*.whl)
          B=$(basename "$WHEEL")
          docker run --rm --network host --runtime=mthreads --shm-size=32g \
            -e MTHREADS_VISIBLE_DEVICES=0 \
            -v "$PWD/dist/$B:/tmp/wheels/$B:ro" \
            -v "$PWD/tests:/opt/ds-tests:ro" \
            -v "$PWD/scripts/ci/musa:/opt/ci:ro" \
            --entrypoint /bin/bash \
            "$MUSA_BUILD_IMAGE" -lc "set -euo pipefail
              python3 -m pip install --no-deps --force-reinstall --no-index '/tmp/wheels/$B'
              echo '=== compat ==='
              python3 -m deep_select.compat
              echo '=== smoke ==='
              python3 /opt/ci/smoke_test.py --expected-torch-musa 2.11.0.post1
              echo '=== regression ==='
              cd /opt/ds-tests && python3 test_musa_backend.py && python3 test_musa_tme_survivor.py"

      - name: Upload wheel artifact
        if: steps.ver.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: musa-wheel-${{ steps.ver.outputs.version }}
          path: dist/deepselect_musa-*.whl
          if-no-files-found: error
          retention-days: 14

  release:
    name: tag, GitHub Release, publish to PyPI
    needs: build
    if: >-
      ${{ github.repository == 'MooreThreads/DeepSelect' &&
          needs.build.result == 'success' &&
          needs.build.outputs.skip != 'true' &&
          (github.event_name == 'push' || inputs.dry_run != true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
    steps:
      - name: Download built wheel
        uses: actions/download-artifact@v4
        with:
          name: musa-wheel-${{ needs.build.outputs.version }}
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: deepselect-musa ${{ needs.build.outputs.version }}
          target_commitish: main
          generate_release_notes: false
          body: |
            Prebuilt `deepselect-musa` ${{ needs.build.outputs.version }} wheel for the MUSA backend.

            - MUSA SDK 5.2, `torch`/`torch_musa` 2.11.0.post1, Python 3.10, x86_64, MTT S5000 (`mp_31`)
            - Build provenance (`_build_info.py`) and runtime compatibility check (`python -m deep_select.compat`)
            - Install:
              ```bash
              pip install deepselect-musa==${{ needs.build.outputs.version }}
              python -m deep_select.compat
              ```
          files: |
            dist/deepselect_musa-*.whl

      - name: Add SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          sha256sum deepselect_musa-*.whl > SHA256SUMS
          cat SHA256SUMS
      - name: Upload SHA256SUMS to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.build.outputs.tag }}" dist/SHA256SUMS --clobber

      - name: Trigger PyPI publish workflow
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const tag = 'v${{ needs.build.outputs.version }}';
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'publish-pypi.yml',
              ref: 'main',
              inputs: { tag },
            });
            core.info(`dispatched publish-pypi.yml for ${tag}`);
